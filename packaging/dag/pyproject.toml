[project]
name = "netdata-ci"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["dagger-io"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.9"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }
