# LiteLLM proxy for the lab: the guessing game's models through the LLM proxy the game already uses.
# Secrets come from the environment (run.sh): LITELLM_API_KEY upstream, LITELLM_MASTER_KEY and DATABASE_URL locally.
model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://llm.netdata.cloud/v1
      api_key: os.environ/LITELLM_API_KEY
    # Illustrative prices: LiteLLM's price map does not know these models, and spend is half of what a gateway
    # is run for.
    model_info:
      input_cost_per_token: 0.00000027
      output_cost_per_token: 0.0000011
  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://llm.netdata.cloud/v1
      api_key: os.environ/LITELLM_API_KEY
    model_info:
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.0000004

litellm_settings:
  callbacks: ["prometheus", "otel"]
  num_retries: 1
  # Budget gauges for every team and key from the start, not only after their first request.
  prometheus_initialize_budget_metrics: true
  # go.d scrapes without a key; the proxy listens on 127.0.0.1 only.
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
