# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway for the lab: the guessing game's models through the LLM proxy the game already uses.
# Secrets come from the environment (run.sh): LITELLM_API_KEY upstream, AGW_KEY_<TEAM> for the game's teams.
config:
  adminAddr: 127.0.0.1:15100
  readinessAddr: 127.0.0.1:15121
  statsAddr: 127.0.0.1:15120
  # The team of the key a request came with, on every metric.
  metrics:
    fields:
      add:
        team: apiKey.team
  # Illustrative prices: agentgateway's catalog does not know these models, and without a price it reports no cost.
  modelCatalog:
  - inline:
      providers:
        openai:
          models:
            deepseek-v4-flash:
              rates: {input: "0.27", output: "1.1"}
            qwen3.8-flash:
              rates: {input: "0.05", output: "0.4"}

frontendPolicies:
  tracing:
    host: 172.17.0.1:44317
    protocol: grpc
    randomSampling: "true"
    attributes:
      team: apiKey.team
  accessLog:
    add:
      team: apiKey.team
    otlp:
      host: 172.17.0.1:44317
      protocol: grpc

# MCP: the game's tools (src/genai-lab/generator/mcp_server.py on 127.0.0.1:3200) on port 3101, with the same keys.
binds:
- port: 3101
  listeners:
  - name: mcp
    protocol: HTTP
    routes:
    - name: guessing-game
      policies:
        apiKey:
          mode: strict
          keys:
          - key: $AGW_KEY_SEARCH
            metadata: {team: search}
          - key: $AGW_KEY_SUPPORT
            metadata: {team: support}
          - key: $AGW_KEY_GROWTH
            metadata: {team: growth}
      backends:
      - mcp:
          targets:
          - name: game
            mcp:
              host: http://127.0.0.1:3200/mcp

llm:
  port: 3100
  policies:
    # One key per team of the game; its team goes onto metrics, spans and access logs. (Budgets per key exist, but
    # show only at agentgateway's admin API, which Netdata does not collect.)
    apiKey:
      mode: strict
      keys:
      - key: $AGW_KEY_SEARCH
        metadata: {team: search}
      - key: $AGW_KEY_SUPPORT
        metadata: {team: support}
      - key: $AGW_KEY_GROWTH
        metadata: {team: growth}
  models:
  - name: deepseek-v4-flash
    provider: openAI
    params:
      model: deepseek-v4-flash
      apiKey: $LITELLM_API_KEY
      baseUrl: https://llm.netdata.cloud/v1
  - name: qwen3.8-flash
    provider: openAI
    params:
      model: qwen3.8-flash
      apiKey: $LITELLM_API_KEY
      baseUrl: https://llm.netdata.cloud/v1
