[package]
name = "otel-oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The network side (the otel-tee relay and the otel-oracle client of the
# agent) is opt-in, so crates that only use the calculator do not build a gRPC
# server or an HTTP client. Build or test it with `--features live`.
[features]
live = ["dep:bytes", "dep:clap", "dep:reqwest", "dep:tokio", "dep:tonic"]

[[bin]]
name = "otel-tee"
path = "src/bin/otel-tee.rs"
required-features = ["live"]

[[bin]]
name = "otel-oracle"
path = "src/bin/otel-oracle.rs"
required-features = ["live"]

[[test]]
name = "tee"
path = "tests/tee.rs"
required-features = ["live"]

[dependencies]
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ng-flatten = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sfst = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, optional = true }
tonic = { workspace = true, features = ["gzip"], optional = true }
wal = { workspace = true }

[dev-dependencies]
bumpalo = { workspace = true }
file-registry = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
