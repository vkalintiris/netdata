template: cont_lookup
 on: system.cpu
 lookup: average \
   -5m unaligned \
   of user
 every: 10s
 warn: $this > 1

template: cont_info
 on: system.cpu
 every: 10s
 calc: 1
 info: one \
two \
 three \
    four \
 five

# a comment that ends in a backslash \
template: cont_after_comment
 on: system.cpu
 every: 10s
 calc: 1

template: cont_comment_inside
 on: system.cpu
 every: 10s
 info: before \
# not a comment \
after
 calc: 1

template: cont_blank_inside
 on: system.cpu
 every: 10s
 info: before \

 calc: 2

template: cont_key
 on: system.cpu
 every: 10s
 ca\
lc: 3

template: \
 cont_entity_name
 on: system.cpu
 every: 10s
 calc: 1

template: cont_after_entity
 on: system.cpu
 every: 10s
 calc: 1
