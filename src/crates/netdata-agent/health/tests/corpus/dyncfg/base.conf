# what the DynCfg scenarios start from: a template, an alarm, and a chain of two rules of one name
template: d_tpl
      on: loop.dyncfg
    calc: $v
   every: 1s
    warn: $this > 50

   alarm: d_alarm
      on: loop.d1
    calc: $v
   every: 1s
    crit: $this > 80

template: d_chain
      on: loop.dyncfg
    calc: $v
   every: 1s
    warn: $this > 10

template: d_chain
      on: loop.other
    calc: $v * 2
   every: 1s
    warn: $this > 20
