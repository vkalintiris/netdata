# repeating notifications
template: p_both
      on: loop.repeat
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 90
  repeat: warning 2s critical 3s

template: p_warn
      on: loop.repeat
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 90
  repeat: warning 2s critical 0s

template: p_delay
      on: loop.repeat
    calc: $v
   every: 1s
    warn: $this > 50
   delay: up 5s
  repeat: warning 2s critical 2s

template: p_plain
      on: loop.repeat
    calc: $v
   every: 1s
    warn: $this > 50
