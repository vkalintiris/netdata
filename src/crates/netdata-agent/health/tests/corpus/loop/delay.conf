# notification delays: the hysteresis, its multiplier and its maximum
template: d_both
      on: loop.delay
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 90
   delay: up 4s down 6s multiplier 2 max 20s

template: d_frac
      on: loop.delay
    calc: $v
   every: 1s
    warn: $this > 50
   delay: up 3s down 5s multiplier 1.5 max 1m

template: d_up_only
      on: loop.delay
    calc: $v
   every: 1s
    warn: $this > 50
   delay: up 10s

template: d_undefined
      on: loop.delay
    calc: $v
   every: 1s
   delay: up 3s down 7s

template: d_none
      on: loop.delay
    calc: $v
   every: 1s
    warn: $this > 50
