# one alert with a calculation and one with a lookup whose window ends 5 seconds back, both every 5 seconds, on a
# chart collected every 2 seconds
template: r_calc
      on: loop.runnable
    calc: $v
   every: 5s
    warn: $this > 50

template: r_lookup
      on: loop.runnable
  lookup: average -10s at -5s
   every: 5s
    warn: $this > 50
