# the summary and info of an alert, with the chart's family and labels put in
template: x_family
      on: loop.texts
    calc: $v
   every: 1s
 summary: on ${family}
    info: family ${family}, kind ${label:kind}, role ${label:role}, none ${label:nope}.

template: x_dollar
      on: loop.texts
    calc: $v
   every: 1s
 summary: $x ${family}
    info: ${family} costs $5 on ${family}

template: x_long
      on: loop.texts
    calc: $v
   every: 1s
 summary: ${label:nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn}
    info: ${label:mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm} then ${family}

template: x_twice
      on: loop.texts
    calc: $v
   every: 1s
 summary: ${label:tricky}/${family}
    info: back\slash <b> & ${family}${family}${label:kind}${label:kind}

template: x_open
      on: loop.texts
    calc: $v
   every: 1s
 summary: ${family
    info: ${label:kind then ${family}

template: x_case
      on: loop.texts
    calc: $v
   every: 1s
 summary: ${Family} ${label:} ${label} ${labels:kind}
    info: ${ family } ${label: kind} {family} $family

template: x_plain
      on: loop.texts
    calc: $v
   every: 1s

template: x_only_summary
      on: loop.texts
    calc: $v
   every: 1s
 summary: only ${label:role}
