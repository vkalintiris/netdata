# two rules under one name, each for a host label's value; a rule that asks for a chart label
template: x_tier
      on: loop.relink
host labels: tier=a
    calc: $v
   every: 1s
    warn: $this > 50

template: x_tier
      on: loop.relink
host labels: tier=b
    calc: $v
   every: 1s
    warn: $this > 60

template: x_kind
      on: loop.relink
chart labels: kind=disk
    calc: $v
   every: 1s
    warn: $this > 50
 summary: ${label:kind} of ${family}
    info: on ${label:mount}
