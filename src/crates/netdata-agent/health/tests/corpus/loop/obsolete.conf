# alerts on charts that become obsolete
template: o_plain
      on: loop.obsolete
    calc: $v
   every: 1s
    warn: $this > 50

template: o_repeat
      on: loop.obsolete.repeating
    calc: $v
   every: 1s
    warn: $this > 50
  repeat: warning 2s critical 2s

template: o_live
      on: loop.obsolete.live
    calc: $v
   every: 1s
    warn: $this > 50

template: o_never
      on: loop.obsolete.never
    calc: $v
   every: 1s
