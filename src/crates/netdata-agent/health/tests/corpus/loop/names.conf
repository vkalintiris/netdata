# alerts that name each other, a dimension, a chart variable and a host variable
template: a_first
      on: loop.names
    calc: $z_last + 1
   every: 1s

template: m_dim
      on: loop.names
    calc: $in + $out_name
   every: 1s
    warn: $this > $hv

template: s_self
      on: loop.names
    calc: $v
   every: 1s
    warn: $s_self > 50 && $this > 50
    crit: $status == $WARNING && $this > 90

template: t_times
      on: loop.names
    calc: $now - $last_collected_t
   every: 1s
    warn: $update_every != 1

template: z_last
      on: loop.names
    calc: $v
   every: 1s

template: zz_after
      on: loop.names
    calc: $z_last + $a_first
   every: 1s
