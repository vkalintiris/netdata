# two alerts per chart: one that repeats, one with a lookup and a calculation
template: f_calc
      on: loop.free
    calc: $v
   every: 1s
    warn: $this > 50
  repeat: warning 1s critical 1s

template: f_lookup
      on: loop.free
  lookup: average -10s of value
    calc: $this * 2
   every: 1s
    warn: $this > 50
