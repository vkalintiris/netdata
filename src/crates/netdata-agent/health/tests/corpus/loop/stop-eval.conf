# three alerts, the last one repeating
template: v_one
      on: loop.stopeval
    calc: $v
   every: 1s
    warn: $this > 50

template: v_two
      on: loop.stopeval
    calc: $v
   every: 1s
    warn: $this > 50

template: v_three
      on: loop.stopeval
    calc: $v
   every: 1s
    warn: $this > 50
  repeat: warning 1s critical 1s
