# the database lookup: what the alert asks for, and what it makes of each outcome
template: l_avg
      on: loop.lookup
  lookup: average -10s of value
   every: 1s
    warn: $this > 50
    crit: $this > 90

template: l_p95
      on: loop.lookup
  lookup: percentile95 -1m unaligned of a,b
   every: 1s

template: l_p90
      on: loop.lookup
  lookup: percentile(90) -5m
   every: 1s

template: l_percentile
      on: loop.lookup
  lookup: percentile -5m
   every: 1s

template: l_tmean
      on: loop.lookup
  lookup: trimmed-mean5 -5m
   every: 1s

template: l_tmedian
      on: loop.lookup
  lookup: trimmed-median -5m at -1m
   every: 1s

template: l_countif
      on: loop.lookup
  lookup: countif(>0.5) -10m absolute
   every: 1s

template: l_countif_ne
      on: loop.lookup
  lookup: countif(!=0.5) -10m
   every: 1s

template: l_opts
      on: loop.lookup
  lookup: sum -2m unaligned absolute percentage min2max null2zero match-ids match-names of *
   every: 1s

template: l_every
      on: loop.lookup
  lookup: max -30s every 10s
    warn: $this != 10

template: l_calc
      on: loop.lookup
  lookup: min -10s
    calc: $this + 1
   every: 1s
