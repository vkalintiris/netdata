# every way a warning and a critical expression combine into a status: present, absent, failing by its result
template: c_warn
      on: loop.combine
    calc: $v
   every: 1s
    warn: $this > 50

template: c_crit
      on: loop.combine
    calc: $v
   every: 1s
    crit: $this > 90

template: c_both
      on: loop.combine
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 90

template: c_none
      on: loop.combine
    calc: $v
   every: 1s

template: c_warn_fails
      on: loop.combine
    calc: $v
   every: 1s
    warn: $nothing + 1

template: c_crit_fails
      on: loop.combine
    calc: $v
   every: 1s
    crit: $nothing + 1

template: c_both_fail
      on: loop.combine
    calc: $v
   every: 1s
    warn: $nothing + 1
    crit: $nothing + 2

template: c_warn_crit_fails
      on: loop.combine
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $nothing + 1

template: c_warn_fails_crit
      on: loop.combine
    calc: $v
   every: 1s
    warn: $nothing + 1
    crit: $this > 90

# comparisons and operators on a value that may be NaN
template: c_ne
      on: loop.combine
    calc: $v
   every: 1s
    warn: $this != 50

template: c_not
      on: loop.combine
    calc: $v
   every: 1s
    warn: !($this > 50)

template: c_div
      on: loop.combine
    calc: $v
   every: 1s
    warn: $this / 2 > 40

# a name nothing knows against a name that is known and has no value
template: c_unknown_cmp
      on: loop.combine
    calc: $v
   every: 1s
    warn: $nothing > 1

template: c_unknown_or
      on: loop.combine
    calc: $v
   every: 1s
    warn: $nothing > 0 || 1 / 1 > 0

template: c_known_or
      on: loop.combine
    calc: $v
   every: 1s
    warn: $knan > 0 || 1 / 1 > 0

template: c_known_cmp
      on: loop.combine
    calc: $v
   every: 1s
    warn: $knan > 1
    crit: $knan + 1
