# the lookup's options text: a percentile id that takes no option, the other conditions of countif, and a
# condition whose number is longer than the text's 100 bytes
template: lo_p75
      on: loop.lookopts
  lookup: percentile75 -5m
   every: 1s

template: lo_countif_eq
      on: loop.lookopts
  lookup: countif(=0.5) -10m
   every: 1s

template: lo_countif_ge
      on: loop.lookopts
  lookup: countif(>=0.5) -10m
   every: 1s

template: lo_countif_lt
      on: loop.lookopts
  lookup: countif(<0.5) -10m
   every: 1s

template: lo_countif_le
      on: loop.lookopts
  lookup: countif(<=0.5) -10m
   every: 1s

template: lo_countif_long
      on: loop.lookopts
  lookup: countif(>1e95) -10m
   every: 1s
