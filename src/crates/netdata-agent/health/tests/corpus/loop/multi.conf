# alerts with different periods on several charts: a template for a context, an alarm for one chart
template: m_fast
      on: loop.multi
    calc: $v
   every: 1s
    warn: $this > 50

template: m_slow
      on: loop.multi
    calc: $v
   every: 7s
    warn: $this > 50

   alarm: m_one
      on: loop.m2
    calc: $v
   every: 3s
    crit: $this > 50

template: m_other
      on: loop.multi.other
    calc: $v
   every: 100s
