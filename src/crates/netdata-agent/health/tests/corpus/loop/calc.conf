# what a calculation leaves as the alert's value, and when it fails
template: k_ok
      on: loop.calc
    calc: $v * 2
   every: 1s
    warn: $this > 100

template: k_unknown
      on: loop.calc
    calc: $nothing
   every: 1s
    warn: $this > 100

template: k_unknown_plus
      on: loop.calc
    calc: $nothing + 1
   every: 1s

template: k_unknown_cmp
      on: loop.calc
    calc: $nothing > 1
   every: 1s

template: k_known_nan
      on: loop.calc
    calc: $knan
   every: 1s

template: k_known_nan_plus
      on: loop.calc
    calc: $knan + 1
   every: 1s

template: k_inf
      on: loop.calc
    calc: 1 / 0
   every: 1s

template: k_const
      on: loop.calc
    calc: 5
   every: 1s
    warn: $this > 1

template: k_status
      on: loop.calc
    calc: $status
   every: 1s
    warn: $status == $CLEAR

template: k_lookup_calc
      on: loop.calc
  lookup: average -10s of value
    calc: $this * 3
   every: 1s
    warn: $this > 100

template: k_lookup_calc_fails
      on: loop.calc
  lookup: average -10s of value
    calc: $nothing + $this
   every: 1s
