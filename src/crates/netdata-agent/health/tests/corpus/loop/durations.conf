# how long an alert was not clear, over a chain of raised statuses; the options and units an entry carries
template: u_chain
      on: loop.durations
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 90

template: u_no_clear
      on: loop.durations
    calc: $v
   every: 1s
    warn: $this > 50
 options: no-clear-notification

template: u_percent
      on: loop.durations
    calc: $v
   every: 1s
    warn: $this > 50
   units: %
   class: Errors
    type: System
component: Disk
      to: sysadmin
    exec: /bin/true
