template: label_all
on: system.cpu
every: 10s
calc: 1
os: linux
hosts: web*
host labels: env=prod
plugin: proc.plugin
module: /proc/stat
chart labels: a=b

template: label_repeated
on: system.cpu
every: 10s
calc: 1
os: linux
os: freebsd
host labels: a=1
host labels: b=2
chart labels: c=3
chart labels: d=4
plugin: p1
plugin: p2

template: label_star_then_value
on: system.cpu
every: 10s
calc: 1
os: *
os: linux
hosts: *
host labels: *

template: label_disable_then_value
on: system.cpu
every: 10s
calc: 1
os: !*
os: linux

template: label_value_then_disable
on: system.cpu
every: 10s
calc: 1
os: linux
os: !*
warn: $this > 1

template: label_disable_chart
on: system.cpu
every: 10s
calc: 1
chart labels: !* *
module: !*

template: label_order
on: system.cpu
every: 10s
calc: 1
host labels: z=1
hosts: h
os: o
chart labels: y=2
module: m
plugin: p

