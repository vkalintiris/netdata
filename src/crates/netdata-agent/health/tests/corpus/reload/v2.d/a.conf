# the rules after an edit: one as it was, one gone, one with another threshold, one new
template: r_keep
      on: loop.reload
    calc: $v
   every: 1s
    warn: $this > 50

template: r_change
      on: loop.reload
    calc: $v
   every: 1s
    warn: $this > 90

template: r_new
      on: loop.reload
    calc: $v
   every: 1s
    crit: $this > 60
