template: twice_every
on: system.cpu
every: 10s
calc: 1
every: 20s
every: 30s

template: twice_calc
on: system.cpu
every: 10s
calc: 1
calc: 2
calc: 3

template: twice_lookup
on: system.cpu
every: 10s
calc: 1
lookup: average -1m
lookup: max -2m of a

template: twice_delay
on: system.cpu
every: 10s
calc: 1
delay: up 1m
delay: down 2m

template: twice_options
on: system.cpu
every: 10s
calc: 1
options: no-clear
options: no-clear-notification

template: twice_repeat
on: system.cpu
every: 10s
calc: 1
repeat: warning 1m
repeat: critical 2m

template: twice_green
on: system.cpu
every: 10s
calc: 1
green: 1
green: 2
red: 3
red: 4
warn: $this > $green
crit: $this > $red

template: twice_labels
on: system.cpu
every: 10s
calc: 1
os: linux
os: freebsd
hosts: a
hosts: b

