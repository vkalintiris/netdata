template: all_keys_template
 on: system.cpu
 class: Utilization
 component: CPU
 type: System
 os: linux
 hosts: *
 plugin: proc.plugin
 module: /proc/stat
 host labels: env=prod
 chart labels: mount_point=/
 lookup: average -10m unaligned of user,system
 units: %
 every: 1m
 green: 75
 red: 85
 calc: $this * 2
 warn: $this > (($status >= $WARNING) ? ($green) : ($red))
 crit: $this > 95
 delay: up 2m down 15m multiplier 1.5 max 1h
 summary: a summary
 info: some info
 to: sysadmin
 exec: /bin/true
 options: no-clear-notification
 repeat: warning 2m critical 30s

alarm: all_keys_alarm
 on: system.load
 class: Errors
 component: Load
 type: System
 lookup: max -1m of load1
 every: 10s
 warn: $this > 4
 crit: $this > 8
 info: load
 to: silent
