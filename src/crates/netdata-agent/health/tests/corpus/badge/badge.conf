# the alerts the badge scenarios draw: a status from a variable, with units, without, and one that never runs
template: b_alert
      on: b.alarm
    calc: $v
   units: widgets
   every: 10s
    warn: $this > 50
    crit: $this > 90

template: b_plain
      on: b.alarm
    calc: $v
   every: 7s
    warn: $this > 50

template: b_wait
      on: b.wait
  lookup: average -10s
   every: 5s
    warn: $this > 50

template: b_name
      on: b.byname
    calc: $v
   every: 3s
    warn: $this > 50

# no warning and no critical test over a calculation that fails: UNDEFINED
template: b_undef
      on: b.undef
    calc: $nothing
   every: 4s

# on a chart that is never collected: it never runs, and stays UNINITIALIZED
template: b_idle
      on: b.idle
    calc: $v
   every: 6s
    warn: $this > 50
