# a first file to try the oracle on

 template: smoke_tmpl
       on: system.cpu
   lookup: average -5m unaligned of user,system
    every: 10s
     warn: $this > 50
     crit: $this > (80
     info: "a quoted text"
    delay: up 1m down 5m multiplier 1.5 max 1h
       to: sysadmin

    alarm: smoke_alarm
       on: system.load
     calc: $load1 * 2
    bogus: x
    every: 1m
