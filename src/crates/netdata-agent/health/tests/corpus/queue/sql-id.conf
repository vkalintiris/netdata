# three rules; the table knows the first two by chart and name
template: s_known
      on: loop.sqlid
    calc: $v
   every: 1s
    warn: $this > 50

template: s_other_hash
      on: loop.sqlid
    calc: $v
   every: 1s
   units: other
    warn: $this > 60

template: s_new
      on: loop.sqlid
    calc: $v
   every: 1s
