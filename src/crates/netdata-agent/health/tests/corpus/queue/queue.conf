# one alert that is evaluated at once, one that waits for its lookup's window, one that repeats
template: q_now
      on: loop.queue
    calc: $v
   every: 1s
    warn: $this > 50

template: q_wait
      on: loop.queue
  lookup: average -10s of value
   every: 1s
    warn: $this > 50

template: q_repeat
      on: loop.queue
    calc: $v
   every: 1s
    warn: $this > 50
  repeat: warning 2s critical 2s
