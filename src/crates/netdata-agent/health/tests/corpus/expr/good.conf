template: good_calc_0
on: system.cpu
every: 10s
calc: 1 + 2

template: good_calc_1
on: system.cpu
every: 10s
calc: $this > 5

template: good_calc_2
on: system.cpu
every: 10s
calc: abs($this)

template: good_calc_3
on: system.cpu
every: 10s
calc: $a ? $b : $c

template: good_calc_4
on: system.cpu
every: 10s
calc: -inf

template: good_calc_5
on: system.cpu
every: 10s
calc: $this > (($status >= $WARNING) ? (75) : (85))

template: good_calc_6
on: system.cpu
every: 10s
calc: 1+1+1+1

template: good_calc_7
on: system.cpu
every: 10s
calc: $10m_cpu_usage

template: good_calc_8
on: system.cpu
every: 10s
calc: ${this}*2

template: good_calc_9
on: system.cpu
every: 10s
calc: not 1

