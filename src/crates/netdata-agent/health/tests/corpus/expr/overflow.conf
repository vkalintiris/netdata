template: ex_over_calc
on: system.cpu
every: 10s
calc: 1e400
zz: 1

template: ex_over_warn
on: system.cpu
every: 10s
calc: 1
warn: $this > 1e400
zz: 1

template: ex_over_bad
on: system.cpu
every: 10s
calc: 1
crit: 1e400 +
zz: 1

template: ex_over_digits
on: system.cpu
every: 10s
calc: 1
warn: $this > 
zz: 1

