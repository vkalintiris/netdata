# five alerts for the summary of raised alerts: two that warn, two that are critical (one without a warning
# expression), and one on a chart that is never collected
template: m_warn_a
      on: loop.sum
    calc: $v
   every: 1s
    warn: $this > 50

template: m_warn_b
      on: loop.sum
    calc: $v
   every: 1s
    warn: $this > 60

template: m_crit_a
      on: loop.sum
    calc: $v
   every: 1s
    warn: $this > 50
    crit: $this > 80

template: m_crit_only
      on: loop.sum
    calc: $v
   every: 1s
    crit: $this > 80

template: m_idle
      on: loop.idle
    calc: $v
   every: 1s
    warn: $this > 50
