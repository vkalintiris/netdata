# one alert with a warning and a critical threshold, every text field set
template: n_plain
      on: loop.notify
   class: Errors
    type: System
component: Disk
    calc: $v
   every: 1s
   units: things
    warn: $this > 50
    crit: $this > 90
 summary: the summary of ${family}
    info: the info of ${label:kind}
      to: sysadmin
