template: no_on_template
every: 10s
calc: 1

alarm: no_on_alarm
every: 10s
calc: 1

template: no_every
on: system.cpu
calc: 1

template: every_zero
on: system.cpu
every: 0
calc: 1

template: nothing_to_do
on: system.cpu
every: 10s

template: only_lookup
on: system.cpu
lookup: average -1m

template: only_warn
on: system.cpu
every: 10s
warn: $this > 1

template: only_crit
on: system.cpu
every: 10s
crit: $this > 1

template: only_info
on: system.cpu
every: 10s
info: x

template: bad_exprs_only
on: system.cpu
every: 10s
warn: (

template: disabled_but_valid
on: system.cpu
every: 10s
calc: 1
os: !*

template: disabled_and_invalid
every: 10s
calc: 1
os: !*

