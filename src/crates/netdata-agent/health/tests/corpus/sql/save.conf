# two alerts on one chart: a plain one and one that repeats
template: s_plain
      on: loop.sql
   class: Errors
    type: System
component: Disk
    calc: $v
   every: 1s
   units: things
    warn: $this > 50
    crit: $this > 90
 summary: the summary of ${family}
    info: the info of ${label:kind}
      to: sysadmin

template: s_repeat
      on: loop.sql
    calc: $v
   every: 1s
    warn: $this > 50
  repeat: warning 2s critical 2s
