# the loop check's rules on hf.values
 alarm: hf_before
    on: hf.values
  calc: $hf_base
 every: 1s
  warn: $this > 50
 units: things

 alarm: hf_base
    on: hf.values
  calc: $a
 every: 1s
  warn: $this > 50
 units: things

 alarm: hf_after
    on: hf.values
  calc: $hf_base
 every: 1s
  warn: $this > 50
 units: things

 alarm: hf_ping
    on: hf.values
  calc: $hf_pong
 every: 1s
  warn: $this > 50

 alarm: hf_pong
    on: hf.values
  calc: $hf_ping
 every: 1s
  warn: $this > 50

 alarm: hf_self
    on: hf.values
  calc: $hf_self + 1
 every: 1s
  warn: $this > 50

 alarm: hf_calc_only
    on: hf.values
  calc: $a * 2
 every: 1s

 alarm: hf_unknown
    on: hf.values
  calc: $hf_nothing + 1
 every: 1s
  warn: $this > 50
 units: things

 alarm: hf_warn_unknown
    on: hf.values
  calc: $a
 every: 1s
  warn: $hf_nothing > 1
 units: things

 alarm: hf_warn_fails
    on: hf.values
  calc: $a
 every: 1s
  warn: $hf_nothing + 1
 units: things

 alarm: hf_crit_only
    on: hf.values
  calc: $a
 every: 1s
  crit: $this > 50
 units: %

 alarm: hf_crit_fails
    on: hf.values
  calc: $a
 every: 1s
  warn: $this > 500
  crit: $hf_nothing + 1
 units: seconds

 alarm: hf_nope
    on: hf.values
lookup: average -5s unaligned of nope
 every: 1s
  warn: $this > 50
 units: things

 alarm: hf_no_clear
    on: hf.values
lookup: max -5s unaligned absolute of a
 every: 1s
  warn: $this > 5
 units: things
options: no-clear-notification
