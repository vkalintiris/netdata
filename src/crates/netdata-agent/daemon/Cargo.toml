[package]
name = "netdata-agent-daemon"
description = "The netdata agent daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "netdata"
path = "src/main.rs"

[dependencies]
netdata-agent-sys = { workspace = true }
netdata-agent-spawn = { workspace = true }
netdata-agent-nrpc = { workspace = true }
dns-lookup = { workspace = true }
# the system libcurl the C agent links, for the crash report (D96.2)
curl = { workspace = true }
# the C zlib the C agent links: gzip bodies come out byte for byte the same
flate2 = { workspace = true, features = ["zlib"] }
mio = { workspace = true, features = ["os-ext"] }
netdata-agent-evloop = { workspace = true }
netdata-agent-inicfg = { workspace = true }
netdata-agent-log = { workspace = true }
netdata-agent-metadata = { workspace = true }
netdata-agent-pulse = { workspace = true }
netdata-agent-ingest = { workspace = true }
netdata-agent-query = { workspace = true }
netdata-agent-rrd = { workspace = true }
netdata-agent-storage = { workspace = true }
netdata-agent-streaming = { workspace = true }
netdata-agent-tls = { workspace = true }
netdata-agent-text = { workspace = true }
netdata-agent-web = { workspace = true }
nix = { workspace = true, features = ["signal", "user", "hostname", "fs", "process", "time", "resource", "net", "poll"] }
serde_json = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
twox-hash = { workspace = true, features = ["xxhash3_64"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# counts allocations, for the tests that prove the signal handler's save allocates nothing
netdata-agent-sys = { workspace = true, features = ["alloc-count"] }
tempfile = { workspace = true }
