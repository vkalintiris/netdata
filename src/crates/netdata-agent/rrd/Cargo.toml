[package]
name = "netdata-agent-rrd"
description = "Hosts, charts and dimensions of the netdata agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
netdata-agent-log = { workspace = true }
netdata-agent-nrpc = { workspace = true }
netdata-agent-pluginsd-proto = { workspace = true }
netdata-agent-storage = { workspace = true }
netdata-agent-sys = { workspace = true }
netdata-agent-text = { workspace = true }
nix = { workspace = true, features = ["time"] }
uuid = { workspace = true, features = ["v4"] }

[features]
# The recording `Upstream` (`testing::Recorder`) for other crates' tests.
testing = []

[dev-dependencies]
netdata-agent-evloop = { workspace = true }
# a handler no test calls
netdata-agent-nrpc = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
