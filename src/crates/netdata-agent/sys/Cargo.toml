[package]
name = "netdata-agent-sys"
description = "The audited system calls of the netdata agent that no safe crate wraps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# counts each thread's allocations, for tests that prove a path allocates nothing (the daemon's dev-dependencies)
alloc-count = []

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["process", "fs", "signal", "poll", "resource", "time"] }
rusqlite = { workspace = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
foreign-types = { workspace = true }
# a TLS connection registers its socket with a poller without handing the socket out (SocketSsl)
mio = { workspace = true }

[dev-dependencies]
# passing descriptors over a socket pair
nix = { workspace = true, features = ["socket", "uio"] }

# default_dispositions() needs a single-threaded process, which the test harness is not
[[test]]
name = "dispositions"
harness = false
