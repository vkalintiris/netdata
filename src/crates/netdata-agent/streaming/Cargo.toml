[package]
name = "netdata-agent-streaming"
description = "Streaming receiver and sender of the netdata agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
netdata-agent-log = { workspace = true }
netdata-agent-sys = { workspace = true }
dns-lookup = { workspace = true }
brotli = { workspace = true }
brotli-decompressor = { workspace = true }
# the C zlib the C agent links: the same inflate and its error codes
flate2 = { workspace = true, features = ["zlib"] }
lz4_flex = { workspace = true }
mio = { workspace = true }
netdata-agent-evloop = { workspace = true }
netdata-agent-tls = { workspace = true }
netdata-agent-inicfg = { workspace = true }
netdata-agent-ingest = { workspace = true }
netdata-agent-pluginsd-proto = { workspace = true }
netdata-agent-rrd = { workspace = true }
netdata-agent-text = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true, features = ["socket", "net", "poll"] }
socket2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
# a stream thread driven one turn at a time
netdata-agent-evloop = { workspace = true, features = ["testing"] }
