[package]
name = "nlogql-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LogQL evaluator (AST → IR → executor) for nlogql."
license = "GPL-3.0-or-later"
publish = false

[lints]
workspace = true

[features]
default = ["cli"]
# Pulls in the deps needed to build the `nlogql-query` binary
# (clap, etc.). Library consumers in otel-ledger can disable
# this to keep their dep graph lean. The actual binary lands in
# SOW-G1.
cli = []

[dependencies]
nlogql = { path = "../nlogql" }
regex = { workspace = true }
twox-hash = { workspace = true, features = ["xxhash64"] }

[dev-dependencies]
